<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<title>HKTCG Replay TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:'Barlow Condensed',Arial Narrow,sans-serif;color:#1a1a1a}
/* 舞台固定 5760x1080；按視窗比例拉伸：3840x2160 輸出會自動被商店螢幕還原成 5760x1080 */
#stage{position:absolute;left:0;top:0;width:5760px;height:1080px;transform-origin:0 0}
.side{position:absolute;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none}
#l{left:0}#r{left:3840px}
.logo{font-size:120px;font-weight:800;color:#e60012;letter-spacing:6px;margin-bottom:50px}
.t{display:flex;align-items:baseline;white-space:nowrap}
.t b{font-size:330px;font-weight:800;line-height:1;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.t i{font-style:normal;font-size:120px;font-weight:600;color:#e60012;font-variant-numeric:tabular-nums}
.bar{margin-top:50px;width:900px;height:12px;background:#e60012}
.run .bar{animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
#mid{position:absolute;left:1920px;top:0;width:1920px;height:1080px;box-sizing:border-box;border-left:10px solid #e60012;border-right:10px solid #e60012;background:#000}
#yt{width:100%;height:100%;border:0;pointer-events:none}
#foot{position:absolute;left:0;right:0;bottom:0;height:24px;background:#e60012}
.side{pointer-events:none;overflow:hidden}.side svg{position:absolute;left:0;top:0}
#l{background:#000 url(riftbound_set2_wide.jpg) center/100% 100% no-repeat}#r{background:#000 url(riftbound_set2_wide.jpg) center/100% 100% no-repeat}
</style>
</head>
<body>
<div id="stage">
 <div class="side" id="l"></div>
 <div id="mid"><iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
 <div class="side" id="r"></div>
 <div id="foot"></div>
</div>
<script>
// 3840x2160 輸出：舞台 x 縮 0.667、y 放 2，商店螢幕再還原。?flat=1 = 正常比例預覽（唔變形）。
const flat=new URLSearchParams(location.search).has('flat');
const st=document.getElementById('stage');
function fit(){
  const sx=innerWidth/5760, sy=innerHeight/1080;
  if(flat){const s=Math.min(sx,sy);st.style.transform='scale('+s+')';}
  else st.style.transform='scale('+sx+','+sy+')';
}
addEventListener('resize',fit);fit();
// 影片：?v=YouTube連結或ID；按 V 換影片
const DEFAULT_V='uiBp5Z0ymkg';
const yt=document.getElementById('yt');
function vid(x){const m=String(x||'').match(/(?:youtu\.be\/|v=|embed\/|live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(x||'')?x:null)}
function loadVideo(x){const id=vid(x);if(!id)return;yt.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&controls=1&rel=0&playsinline=1&enablejsapi=1'}
loadVideo(new URLSearchParams(location.search).get('v')||DEFAULT_V);
function ytCmd(f){yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:''}),'*')}
let vPlaying=true;
addEventListener('keydown',e=>{
  if(e.key==='k'||e.key==='K'||e.key===' '){e.preventDefault();vPlaying?ytCmd('pauseVideo'):ytCmd('playVideo');vPlaying=!vPlaying}
  else if(e.key==='c'||e.key==='C'){yt.style.pointerEvents=yt.style.pointerEvents==='auto'?'none':'auto'}
  else if(e.key==='v'||e.key==='V'){const u=prompt('貼上 YouTube 連結');if(u)loadVideo(u)}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
</script>
</body>
</html>
